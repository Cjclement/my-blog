<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7 Questions — Just Enough To Be Transformed</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d1117; color: #f0f6fc; display: flex; justify-content: center; padding: 32px 16px; margin: 0; }
    .container { width: 100%; max-width: 480px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .brand { display: flex; align-items: baseline; gap: 6px; }
    .brand .number-7 { font-size: 3.5rem; font-weight: 800; line-height: 1; }
    .brand .number-7::after { content: ""; position: absolute; top: 50%; left: 10%; width: 60%; height: 3px; background-color: currentColor; transform: translateY(-50%); }
    .brand .title-text { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .tagline { color: #8b949e; font-size: 0.95rem; margin-bottom: 32px; }
    .cards-list { display: flex; flex-direction: column; gap: 16px; }
    .card { display: block; text-decoration: none; color: inherit; background: rgba(22, 27, 34, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 22px; padding: 20px 22px; transition: transform 0.2s; }
    .card:hover { transform: translateY(-2px); border-color: #58a6ff; }
    .card-top { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 700; }
    .card-desc { font-size: 0.88rem; color: #8b949e; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="number-7">7</span>
        <span class="title-text">Questions</span>
      </div>
    </header>
    <p class="tagline">Just Enough To Be Transformed</p>
    <main class="cards-list">
      <a href="/faith" class="card"><div class="card-top">FAITH <span>&rarr;</span></div><p class="card-desc">Content related to one's walk with God.</p></a>
      <a href="/cybersecurity" class="card"><div class="card-top">IT &amp; CYBERSECURITY <span>&rarr;</span></div><p class="card-desc">Cybersecurity, GRC, network engineering.</p></a>
      <a href="/episodes" class="card"><div class="card-top">EPISODES &amp; INTERVIEWS <span>&rarr;</span></div><p class="card-desc">Conversations with industry experts.</p></a>
      <a href="/financial" class="card"><div class="card-top">FINANCIAL MARKET <span>&rarr;</span></div><p class="card-desc">Market analysis and updates.</p></a>
    </main>
  </div>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) { window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; }); }
      });
    }
  </script>
</body>
</html>
